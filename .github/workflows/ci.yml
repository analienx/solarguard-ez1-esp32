name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q

  safety-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the firmware safety state machine tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I firmware/main \
            firmware/test/test_safety_state.c firmware/main/safety_state.c \
            -o test_safety_state
          ./test_safety_state

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - working-directory: firmware
        run: |
          idf.py set-target esp32s3
          idf.py build
